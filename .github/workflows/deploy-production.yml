name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mise-studio-production
  cancel-in-progress: false

env:
  GIT_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
  APP_IMAGE_TAG: mise-studio-app:git-${{ github.event.workflow_run.head_sha || github.sha }}
  WEB_IMAGE_TAG: mise-studio-web:git-${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_ARCHIVE: /tmp/mise-studio-${{ github.event.workflow_run.head_sha || github.sha }}.tar.gz

jobs:
  build-and-deploy:
    name: Build and deploy to production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out verified source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.GIT_REVISION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          target: app
          platforms: linux/amd64
          load: true
          tags: ${{ env.APP_IMAGE_TAG }}
          cache-from: type=gha,scope=mise-studio-app
          cache-to: type=gha,mode=max,scope=mise-studio-app
          provenance: false

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          platforms: linux/amd64
          load: true
          tags: ${{ env.WEB_IMAGE_TAG }}
          cache-from: type=gha,scope=mise-studio-web
          cache-to: type=gha,mode=max,scope=mise-studio-web
          provenance: false

      - name: Package images
        run: docker save "$APP_IMAGE_TAG" "$WEB_IMAGE_TAG" | gzip -1 > "$IMAGE_ARCHIVE"

      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload images to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          REMOTE_ARCHIVE="/home/${DEPLOY_USER}/uploads/mise-studio-${GIT_REVISION}.tar.gz"
          scp -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            "$IMAGE_ARCHIVE" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_ARCHIVE}"

      - name: Activate images and verify health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          REMOTE_ARCHIVE="/home/${DEPLOY_USER}/uploads/mise-studio-${GIT_REVISION}.tar.gz"
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/mise-studio-deploy '${REMOTE_ARCHIVE}' '${APP_IMAGE_TAG}' '${WEB_IMAGE_TAG}' '${GIT_REVISION}'"

      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://video.0000238.xyz/ > /dev/null
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://video.0000238.xyz/api/auth/me)" = "401"
