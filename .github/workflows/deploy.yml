name: Deploy miseStudio

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: mise-studio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/mise-studio
          chmod 600 ~/.ssh/mise-studio
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package release
        env:
          RELEASE_ID: ${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude=node_modules \
            --exclude=./projects \
            --exclude=./output \
            --exclude=.venv \
            --exclude=.worktrees \
            --exclude=.superpowers \
            -czf "$RUNNER_TEMP/$RELEASE_ID.tar.gz" .

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
        run: |
          ssh_args=(-i ~/.ssh/mise-studio -o IdentitiesOnly=yes)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "${ssh_args[@]}" "$remote" "mkdir -p /opt/miseStudio/incoming /opt/miseStudio/releases"
          scp "${ssh_args[@]}" "$RUNNER_TEMP/$RELEASE_ID.tar.gz" "$remote:/opt/miseStudio/incoming/$RELEASE_ID.tar.gz"
          ssh "${ssh_args[@]}" "$remote" "set -eu; release='/opt/miseStudio/releases/$RELEASE_ID'; mkdir -p \"\$release\"; tar -xzf '/opt/miseStudio/incoming/$RELEASE_ID.tar.gz' -C \"\$release\"; bash \"\$release/deploy/deploy.sh\" \"\$release\""
