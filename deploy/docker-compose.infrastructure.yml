services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openmontage
      POSTGRES_USER: openmontage
      POSTGRES_PASSWORD: openmontage
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmontage -d openmontage"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

x-openmontage-operations:
  billing_worker:
    command: python -m server.billing_worker
    one_shot_command: python -m server.manage reconcile-billing --once
    supervision: run exactly one worker process per environment with restart-on-failure
    requires:
      - DATABASE_URL
      - REDIS_URL
      - AUTH_HMAC_SECRET
      - NEWAPI_TEXT_TOKEN_KEYS_JSON
      - NEWAPI_IMAGE_TOKEN_KEYS_JSON
      - NEWAPI_VIDEO_TOKEN_KEYS_JSON
      - BILLING_REFERENCE_RECOVERY_SECONDS
      - BILLING_RECEIPT_DEADLINE_SECONDS
      - BILLING_HOLD_TIMEOUT_SECONDS
      - BILLING_WORKER_HEARTBEAT_TTL_SECONDS
